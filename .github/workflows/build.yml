name: Build Flutter Apps (Windows & Android)

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - name: Use Kotlin compatible with mobile_scanner
        shell: bash
        run: |
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.2.20" apply false/' android/settings.gradle.kts
      - name: Use Flutter-compatible Android Gradle Plugin
        shell: bash
        run: |
          sed -i 's/id("com.android.application") version "[^"]*" apply false/id("com.android.application") version "8.11.1" apply false/' android/settings.gradle.kts
      - name: Use Flutter-compatible intl constraint
        shell: bash
        run: |
          sed -i 's/  intl: \^0\.19\.0/  intl: ^0.20.3/' pubspec.yaml
      - name: Enable legacy generated localization package
        shell: bash
        run: |
          printf '\nsynthetic-package: true\n' >> l10n.yaml
      - name: Use Flutter-compatible Gradle version
        shell: bash
        run: |
          sed -i 's/gradle-[0-9.]*-all\.zip/gradle-8.14.3-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: marko-group-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64
      - name: Enable Windows desktop support
        shell: pwsh
        run: flutter config --enable-windows-desktop
      - name: Use Flutter-compatible intl constraint
        shell: pwsh
        run: |
          (Get-Content pubspec.yaml) -replace '  intl: \^0\.19\.0', '  intl: ^0.20.3' | Set-Content pubspec.yaml
      - name: Enable legacy generated localization package
        shell: pwsh
        run: |
          Add-Content -Path l10n.yaml -Value "`nsynthetic-package: true"
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: marko-group-windows-exe
          path: build/windows/x64/runner/Release/
