name: marko_group
description: "MarkoGroup ERP"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^18.0.1

  # Database (SQLite / Offline-First)
  drift: ^2.22.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.0

  # Precision calculations (financial/stock)
  decimal: ^3.2.6
  
  # Core utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  equatable: ^2.0.7
  fpdart: ^1.1.1 # For functional error handling and Option types
  sqlite3: ^3.6.0
  crypto: ^3.0.7
  pdf: ^3.11.3
  printing: ^5.14.3
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.3
  archive: ^4.0.9
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  image_picker: ^1.2.1
  mobile_scanner: ^7.4.2
  syncfusion_flutter_pdf: ^34.2.8
  reorderable_grid_view: ^2.2.8
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.jpeg"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/logo.jpeg"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/images/logo.jpeg"
