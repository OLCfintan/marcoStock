name: marko_group
description: "MarkoGroup — Professional ERP & Commercial Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc_concurrency: ^0.2.5
  equatable: ^2.0.7

  # Local Database (Drift / SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28

  # Decimal Precision & Money
  decimal: ^3.0.2

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^14.8.1

  # Localization
  intl: ^0.19.0

  # PDF Generation & Printing
  pdf: ^3.11.2
  printing: ^5.13.5

  # Excel & CSV
  excel: ^4.0.6
  csv: ^6.0.0

  # Charts
  fl_chart: ^0.70.2

  # Cryptography & Security
  cryptography: ^2.7.0
  encrypt: ^5.0.3

  # Networking
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Password Hashing
  bcrypt: ^1.1.3

  # File Handling
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^8.1.7

  # System Info
  package_info_plus: ^8.2.1

  # UUID Generation
  uuid: ^4.5.1

  # Date Utilities
  clock: ^1.1.2

  # Collection utilities
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generators
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  injectable_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^9.1.7

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
